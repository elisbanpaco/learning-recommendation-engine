name: Continuous Deployment (CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        
    - name: Install dependencies
      run: uv sync

    - name: Preprocess data (downloads dataset automatically)
      run: uv run python scripts/preprocess_data.py

    - name: Train models
      run: |        
        uv run python src/ml/clustering/train_clustering.py
        uv run python src/ml/recommendation/train_svd.py
        uv run python src/ml/reinforcement/train_agent.py

    - name: Deploy to Render
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      run: |
        curl -X POST https://api.render.com/deploy/${{ secrets.RENDER_SERVICE_ID }} \
          -H "Authorization: Bearer $RENDER_API_KEY"