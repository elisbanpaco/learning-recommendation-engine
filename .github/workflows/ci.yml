name: Continuous Integration (CI)

on:
  push:
    branches: 
      - "main"
      - "rama-experimento*"
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install uv (Fast Python Package Manager)
      uses: astral-sh/setup-uv@v5
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        
    - name: Install dependencies
      run: uv sync
      
    - name: Run unit tests
      run: uv run python -m unittest discover -s tests

  experiment:
    needs: test
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/heads/rama-experimento')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      
    - name: Train model on Experiment Branch
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        MLFLOW_TRACKING_URI: databricks
        MLFLOW_EXPERIMENT_NAME: /Shared/mlops_experiment_${{ github.sha }}
      run: |
        uv sync        
        uv run python src/ml/clustering/train_clustering.py
        uv run python src/ml/reinforcement/train_agent.py